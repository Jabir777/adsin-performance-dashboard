<title>ADSIN · Performance & Analysis Dashboard</title>

<style>
:root{--bg:#09030f;--p1:#140a24;--p2:#1c0f33;--ln:#2e1a4f;--ac:#a855f7;--ac2:#e879f9;--tx:#f5eeff;--mu:#a99cc4;--ok:#34d399;--bad:#fb7185;--wn:#fbbf24;--ff:'Poppins',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1100px 520px at 78% -8%,#3b1370 0%,transparent 62%),radial-gradient(800px 480px at -5% 4%,#24093f 0%,transparent 60%),var(--bg);color:var(--tx);font:400 14px/1.5 var(--ff);min-height:100vh}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 28px 0}
.logo b{font:800 36px/1 var(--ff);letter-spacing:-1px;display:block}.logo span{font:500 12px var(--ff);color:var(--mu)}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav button{background:none;border:0;color:var(--mu);font:600 12px var(--ff);padding:9px 11px;border-bottom:2px solid transparent;cursor:pointer;text-transform:uppercase;letter-spacing:.3px;border-radius:0}
nav button:hover{color:var(--tx)}nav button.on{color:#fff;border-color:var(--ac2)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 28px}
.pill{padding:4px 12px;border-radius:20px;font:600 11px var(--ff);border:1px solid var(--ln);color:var(--mu)}.pill.ok{color:var(--ok);border-color:#1f6b53}.pill.err{color:var(--bad);border-color:#7a2a3a}
button,.btn{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:7px 14px;font:500 12.5px var(--ff);cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--ac)}.go{background:linear-gradient(90deg,#7c3aed,#c026d3);border:0;color:#fff;font-weight:600}
select,input[type=search],input[type=number]{background:var(--p1);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:7px 12px;font:400 12.5px var(--ff)}
.tk{display:flex;align-items:center;background:#12071f;border-block:1px solid var(--ln);margin-top:10px}.tk[hidden]{display:none}
.tk-l{padding:9px 16px;font:700 11.5px var(--ff);background:linear-gradient(90deg,#7c3aed,#c026d3);white-space:nowrap;letter-spacing:.5px;z-index:1}
.tk-v{overflow:hidden;flex:1}.tk-t{display:flex;width:max-content;animation:tk var(--d,90s) linear infinite}.tk-v:hover .tk-t{animation-play-state:paused}
.tk-t>div{display:flex;align-items:center}@keyframes tk{to{transform:translateX(-50%)}}
.tk-i{padding:9px 8px;white-space:nowrap;cursor:pointer;font-size:13px}.tk-i:hover{color:#fff;text-decoration:underline}.tk-s{color:var(--mu)}.tk-sep{color:#5b3b8c;padding:0 10px}
.tk-g,.tk-w,.tk-c,.tk-h{font:700 10px var(--ff);padding:2px 8px;border-radius:10px;margin-right:7px;text-transform:uppercase}
.tk-g{background:#0f3b2e;color:var(--ok)}.tk-w{background:#4a3708;color:var(--wn)}.tk-c{background:#4a1220;color:var(--bad)}.tk-h{background:#2c1450;color:#d8b4fe}
@media(prefers-reduced-motion:reduce){.tk-t{animation:none}}
main{padding:4px 28px 60px;max-width:1400px;margin:auto}
h2{font:700 18px var(--ff);margin:28px 0 12px}h2 small{font:400 12px var(--ff);color:var(--mu);margin-left:8px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}
.card{background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid var(--ln);border-radius:22px;padding:18px 20px;min-width:0}
.card h3{margin:0 0 12px;font:600 14px var(--ff)}.card h3 small{color:var(--mu);font-weight:400;margin-left:6px}
.k{color:var(--mu);font-size:12px}.v{font:700 26px/1.2 var(--ff);margin:4px 0}.s{color:var(--mu);font-size:11.5px}
.good{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--wn)}
.tw{overflow:auto;max-height:560px;border:1px solid var(--ln);border-radius:18px;background:var(--p1)}
table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:9px 13px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font:600 11.5px var(--ff);cursor:pointer;position:sticky;top:0;background:var(--p2);z-index:1}
tr:last-child td{border:0}td .bb{display:block;height:4px;border-radius:4px;background:linear-gradient(90deg,#7c3aed,#e879f9);margin:5px 0 0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:center}.chips button.on{background:linear-gradient(90deg,#7c3aed,#c026d3);border:0;color:#fff}
.dc{display:flex;flex-direction:column;gap:2px}.dc .n{font-weight:600}
.iss{border-left:3px solid var(--ac);padding:10px 14px;margin:0 0 10px;background:var(--p1);border-radius:0 14px 14px 0}.iss.c{border-color:var(--bad)}.iss.u{border-color:var(--wn)}.iss.g{border-color:var(--ok)}
.iss .m{color:var(--mu);font-size:11.5px;margin-bottom:3px}.iss p{margin:0;white-space:pre-wrap}.list{max-height:480px;overflow:auto}
.note{color:var(--mu);font-size:12px}.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--p2);border:1px solid var(--ln);font-size:11.5px;margin:0 6px 6px 0}
.bh{display:flex;flex-direction:column;gap:7px}.br{display:grid;grid-template-columns:minmax(80px,150px) 1fr 70px;gap:10px;align-items:center;font-size:12.5px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt{height:9px;background:#24143f;border-radius:6px;overflow:hidden}.bt i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#e879f9);border-radius:6px}.bv{text-align:right;color:var(--mu)}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0 10px}.lg span{margin-right:14px;font-size:12px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.mx td,.mx th{padding:5px 7px;text-align:center;font-size:12px}.mx td:first-child,.mx th:first-child{text-align:left}.mx .y{color:var(--ok)}.mx .n{color:#4a3a66}
iframe{width:100%;height:560px;border:1px solid var(--ln);border-radius:16px;background:#fff}
.tgi{width:120px}.sc{display:inline-block;min-width:38px;text-align:center;border-radius:10px;padding:1px 8px;font-weight:700}
@media(max-width:700px){header,.bar,main{padding-left:14px;padding-right:14px}nav{margin-left:0}.g2{grid-template-columns:1fr}}

:root{--bg:#0d0512;--p1:#130a1c;--p2:#1c102c;--ln:#35204f}
body{background:radial-gradient(900px 520px at 88% -10%,#4d1688 0%,transparent 60%),radial-gradient(720px 440px at -8% 0,#2b0d49 0%,transparent 60%),#0d0512;background-attachment:fixed}
header{position:sticky;top:0;z-index:30;background:rgba(13,5,18,.9);backdrop-filter:blur(14px);padding:10px 22px 0;border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:12px}.logo img{height:46px;display:block}.logo span{font:500 12px var(--ff);color:var(--mu);border-left:1px solid var(--ln);padding-left:12px}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center}
nav{flex-basis:100%;margin:0;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{white-space:nowrap;min-height:42px}
.bar{padding:12px 22px}.pre{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none;padding:2px 0}.pre::-webkit-scrollbar{display:none}
.pre button{white-space:nowrap;border-radius:20px;padding:7px 14px;min-height:36px}.pre button.on{background:linear-gradient(90deg,#7c3aed,#c026d3);border:0;color:#fff;font-weight:600}
.cal{display:flex;align-items:center;gap:6px;color:var(--mu)}.cal input{color-scheme:dark;padding:6px 8px}
.card{box-shadow:0 10px 30px -18px #a855f7;background:linear-gradient(160deg,rgba(32,16,52,.92),rgba(16,8,26,.95))}
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin:18px 0 4px;padding:26px 28px;border-radius:28px;border:1px solid var(--ln);background:radial-gradient(500px 260px at 100% 0,rgba(192,38,211,.28),transparent 70%),linear-gradient(160deg,#1e1033,#0f0719)}
.hero h1{font:800 clamp(26px,4.4vw,44px)/1.08 var(--ff);margin:6px 0 10px;letter-spacing:-1px}.hero p{margin:0;max-width:820px;color:#d9ccef;line-height:1.75}.hero p b{color:#fff}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}.ring{background:var(--p1);border:1px solid var(--ln);border-radius:20px;padding:12px;text-align:center}.ring svg{width:100%;max-width:120px}.ring b{display:block;font-size:13px}.ring span{color:var(--mu);font-size:11px}
.hero .ring{background:none;border:0;min-width:150px}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn svg{width:150px;flex:none}.lg2{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}.lg2 div{display:flex;align-items:center;gap:8px}.lg2 i{width:10px;height:10px;border-radius:3px;flex:none}.lg2 span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lg2 b{color:var(--mu);font-weight:500}
.fn{display:flex;flex-direction:column;gap:6px}.fr{display:flex;flex-direction:column;align-items:center}.fb{background:linear-gradient(90deg,#7c3aed,#c026d3);border-radius:10px;padding:5px;text-align:center;min-width:52px;font-size:13px}.fr span{font-size:11.5px;color:var(--mu)}.fr em{font-style:normal;color:var(--ac2)}
.hm{display:grid;gap:3px;align-items:center;font-size:10px;color:var(--mu)}.hm i{display:block;height:18px;border-radius:4px}
.pod{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.pod .card{text-align:center}.pod .md{font-size:30px}.pod .nm{font-weight:700;font-size:15px}
footer{text-align:center;color:var(--mu);font-size:11.5px;padding:26px 16px 40px;border-top:1px solid var(--ln);margin-top:30px}
.grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
button,.btn,select,input{min-height:36px}
@media(max-width:720px){header{padding:8px 12px 0}.logo img{height:36px}.logo span{display:none}.bar{padding:10px 12px}main{padding-left:12px;padding-right:12px}.hero{grid-template-columns:1fr;padding:20px}.v{font-size:22px}.hr button{display:none}h2{font-size:16px}.card{padding:14px 15px;border-radius:18px}.dn svg{width:120px}.cal{width:100%}.cal input{flex:1}}
@media print{header,.bar,.tk,footer{display:none!important}body{background:#fff;color:#111}.card,.hero,.tw,.ring{background:#fff!important;color:#111;box-shadow:none;border-color:#ccc}.hero p,.hero p b,.v,td,th{color:#111!important}}

/* v2 */
.ins{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}.ins .ic{font-size:22px;margin-bottom:6px}.ins b{font-size:14px;line-height:1.35;display:block}
.lg{display:flex;flex-wrap:wrap;gap:4px 0;margin-top:6px}
#bn{display:none}
td .bt{display:block;min-width:120px}
@media(max-width:720px){#bn{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(13,5,18,.96);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#bn button,#bn a{flex:1;background:none;border:0;border-radius:12px;color:var(--mu);font:600 10px var(--ff);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:48px;text-decoration:none}
#bn i{font-style:normal;font-size:18px}#bn .on{color:#fff;background:linear-gradient(160deg,#4c1d95,#86198f)}body{padding-bottom:70px}.hr .btn{padding:6px 10px;font-size:12px}}
@media print{#bn{display:none!important}}

 h+=`<h2>Trend overlays</h2><div class="g2">`+L("sales",x=>x.fees||0,"Fees collected per day")+L("sales",x=>x.leads||0,"Leads per day")+L("sales",x=>x.reg||0,"Registrations per day")+pn("Tasks done per day",line2(series([...dr("mkt"),...dr("med")],x=>x.done||0),series([...dr("mkt",p),...dr("med",p)],x=>x.done||0),"This period","Previous"))+L("ment",x=>x.comp||0,"Mentor sessions per day")+L("plc",x=>x.iv||0,"Interviews per day")+`</div>`;
 return h}
function shareText(){const d=document.createElement("div");d.innerHTML=vOverview();const p=d.querySelector(".hero p"),h=d.querySelector(".hero h1");return"ADSIN · Performance & Analysis\n"+W.label+"\n\n"+(h?h.textContent+"\n":"")+(p?p.textContent:"No reports in this period.")}
function doShare(btn){const tx=shareText(),o=btn?btn.innerHTML:"";const ok=()=>{if(btn){btn.innerHTML="✓ Copied";setTimeout(()=>btn.innerHTML=o,1600)}};
 if(navigator.share&&matchMedia("(max-width:720px)").matches){navigator.share({title:"ADSIN summary",text:tx}).catch(()=>{});return}
 (navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(ok,()=>{const a=document.createElement("textarea");a.value=tx;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()})}
function bnav(){$("#bn").innerHTML=[["overview","🏠","Overview"],["sales","💰","Sales"],["compare","⚖️","Compare"],["issues","⚠️","Issues"]].map(x=>`<button data-t="${x[0]}" class="${ST.tab===x[0]?"on":""}"><i>${x[1]}</i>${x[2]}</button>`).join("")+`<button data-cp="1"><i>📋</i>Share</button><a href="${CFG.SHEET}" target="_blank" rel="noopener"><i>📄</i>Sheet</a>`}

/* ---------- v3: employee contribution & performance ---------- */
const KEYM={sales:[["fees","Fees collected",inr],["leads","Leads handled",N],["reg","Registrations",N]],mkt:[["done","Tasks done",N],["t","Tasks logged",N],["ot","On-time",N]],med:[["done","Tasks done",N],["t","Tasks logged",N],["ot","On-time",N]],ment:[["comp","Sessions done",N],["pres","Students present",N],["exp","Students expected",N]],acad:[["cc","Classes held",N],["sp","Students present",N],["cs","Classes scheduled",N]],plc:[["cv","CVs shared",N],["iv","Interviews held",N],["se","Selected",N]]};
function vContrib(d){const km=KEYM[d],sc=(SC[d]||[]).filter(p=>p.n!=="(name not entered)");if(!km||!sc.length)return"";
 const pv={};agg(dr(d,W.prev)).forEach(a=>pv[a.n]=a);const T=tot(dr(d)),pm=km[0][0];
 const col=s=>s>=75?"#34d399":s>=50?"#fbbf24":"#fb7185";
 const ordered=sc.slice().sort((a,b)=>(b.a[pm]||0)-(a.a[pm]||0));
 const share=ordered.filter(p=>(p.a[pm]||0)>0).map((p,i)=>[p.n,p.a[pm],PAL[i%PAL.length]]);
 let h=`<h2>Employee contribution &amp; performance <small>${esc(D[d].l)} · ${esc(W.label)}</small></h2>`;
 h+=`<div class="g2">`+pn(`Who contributed the ${km[0][1].toLowerCase()}`,share.length?stack(share)+barH(share.map(x=>[x[0],x[1]]),km[0][2]):'<p class="note">No data in this period.</p>',"share of team total")+pn("Performance score ranking",barH(sc.map(p=>[p.n,p.score]),v=>v+"/100"),"out of 100")+`</div>`;
 h+=`<div class="grid ec" style="margin-top:14px">`+ordered.map(p=>{const a=p.a,pa=pv[p.n],weak=p.ck.filter(c=>c[1]!=null).sort((x,y)=>x[1]-y[1])[0],rank=sc.findIndex(q=>q.n===p.n)+1,ch=pa&&pa[pm]>0?Math.round((a[pm]-pa[pm])/pa[pm]*100):null;
  return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>${esc(p.n)}</b><div class="s">Rank ${rank} of ${sc.length} · ${a.days} reporting day${a.days===1?"":"s"}</div></div><span class="sc" style="background:${col(p.score)}22;color:${col(p.score)};font-size:18px;padding:4px 12px">${p.score}</span></div>`+
  km.map(m=>{const v=a[m[0]]||0,t=T[m[0]]||0,sh=t>0?Math.round(v/t*100):0;return`<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:12px"><span class="k">${m[1]}</span><span><b>${m[2](v)}</b> <span class="k">· ${sh}% of team</span></span></div><span class="bt"><i style="width:${Math.max(sh,2)}%"></i></span></div>`}).join("")+
  `<div class="s" style="margin-top:10px">${ch==null?"No previous-period figure to compare.":`${km[0][1]} <span class="${ch>=0?"good":"bad"}">${ch>=0?"▲":"▼"} ${Math.abs(ch)}%</span> vs previous period.`}</div>`+
  `<div class="s" style="margin-top:4px">${weak?(weak[1]>=.8?`✅ Strong across checks. Weakest: ${esc(weak[0])} (${Math.round(weak[1]*100)}%).`:`⚠️ Improve: <b>${esc(weak[0])}</b> (${Math.round(weak[1]*100)}%).`):""}</div></div>`}).join("")+`</div>`;
 return h}

/* ---------- same-person name merging ---------- */
let MERGED=[];
function mergeNames(){MERGED=[];const nz=n=>n.toLowerCase().replace(/[^a-z ]/g," ").trim().split(/\s+/).filter(Boolean),AL=CFG.ALIAS||{};
 for(const d of SECT){const rows=E.filter(e=>e.d===d&&e.k!=="?");if(!rows.length)continue;const names={};
  rows.forEach(e=>{const a=AL[nz(e.n).join(" ")];if(a)e.n=tc(a);(names[e.n]=names[e.n]||[]).push(e)});
  const list=Object.keys(names).map(n=>({n,t:nz(n)})),map={},comp=t=>t.slice(1).join("");
  list.forEach(s=>{const cand=list.filter(c=>c!==s&&c.t[0]===s.t[0]&&(s.t.length===1||(c.t.length>s.t.length&&s.t.every((x,i)=>c.t[i]===x))||(s.t.length>1&&comp(c.t)===comp(s.t)&&c.n.length>s.n.length)));
   if(cand.length===1&&(s.t.length>1||c_ok(s,list)))map[s.n]=cand[0].n});
  Object.keys(map).forEach(a=>{let b=map[a],i=0;while(map[b]&&i++<5)b=map[b];names[a].forEach(e=>{e.n=b;e.k=nameKey(b)});MERGED.push([D[d].l,a,b])})}}
const c_ok=()=>true;
function vMerged(){return`<h2>Names treated as the same person</h2><div class="card">${MERGED.length?`<p class="note" style="margin-top:0">These spellings were joined automatically so each person appears once. If one is wrong, tell me or add it to <b>CFG.ALIAS</b>.</p>${MERGED.map(m=>`<span class="tag">${esc(m[0])}: ${esc(m[1])} → <b>${esc(m[2])}</b></span>`).join("")}`:'<p class="note" style="margin:0">No duplicate spellings found.</p>'}</div>`}
function vModes(){const rs=dr("ment"),by={};rs.forEach(e=>{const m=e.mode||"Mentor DAR";(by[m]=by[m]||[]).push(e)});const ks=Object.keys(by);if(ks.length<2)return"";return`<h2>Offline &amp; online mentors</h2><div class="g2">`+pn("Sessions completed by mode",donut(ks.map(k=>[k,tot(by[k]).comp||0])))+pn("Reports by mode",barH(ks.map(k=>[k,by[k].length])))+`</div>`}

const TABS=[["overview","Overview",vOverview],["compare","Compare",vCompare],["decisions","Decisions",vDecisions],["sales","Sales",()=>((vSales)()+vContrib("sales"))],["mkt","Marketing",()=>((()=>vTask("mkt"))()+vContrib("mkt"))],["med","Media",()=>((()=>vTask("med"))()+vContrib("med"))],["ment","Mentors",()=>((vMent)()+vModes()+vContrib("ment"))],["acad","Academics",()=>((vAcad)()+vContrib("acad"))],["plc","Placement",()=>((vPlc)()+vContrib("plc"))],["issues","Issues",vIssues],["targets","Targets",vTargets],["quality","Data quality",()=>vQuality()+vMerged()],["data","Data",vData],["sheet","Sheet",vSheet]];
/* ---------- ticker ---------- */
function ticker(){const el=$("#ticker");if(!E.length){el.hidden=true;return}const it=[],add=(c,t,h,go)=>it.push(`<span class="tk-i" data-go="${go||""}"><span class="tk-${c}">${t}</span>${h}</span><span class="tk-sep">◆</span>`);
 const s=tot(dr("sales"));add("h","Fees",`<b>${inr(s.fees||0)}</b> <span class="tk-s">collected · ${N(s.leads||0)} leads</span>`,"sales");
 SECT.forEach(d=>{const p=(SC[d]||[])[0];if(p)add("g","Top "+D[d].l,`<b>${esc(p.n)}</b> <span class="tk-s">score ${p.score}</span>`,d)});
 RC.filter(r=>r.l==="c").slice(0,10).forEach(r=>add("c","Critical",`<b>${esc(r.who)}</b> — ${esc(r.t)}`,r.go));RC.filter(r=>r.l==="w").slice(0,14).forEach(r=>add("w","Watch",`<b>${esc(r.who)}</b> — ${esc(r.t)}`,r.go));
 const one=it.join("");el.hidden=false;el.innerHTML=`<div class="tk-l">● WATCH LIST</div><div class="tk-v"><div class="tk-t" style="--d:${Math.max(40,it.length*4)}s"><div>${one}</div><div aria-hidden="true">${one}</div></div></div>`}
/* ---------- render & events ---------- */
function render(){W=win();SC={};SECT.forEach(d=>SC[d]=score(d,dr(d)));RC=E.length?recs():[];
 $("#pre").innerHTML=PRE.map(x=>`<button data-pre="${x[0]}" class="${x[0]===ST.pre?"on":""}">${x[1]}</button>`).join("");if(W.f&&document.activeElement.type!=="date"){$("#df").value=dk(W.f);$("#dt").value=dk(W.t)}
 $("#nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]===ST.tab?"on":""}">${t[1]}</button>`).join("");
 const f=(TABS.find(t=>t[0]===ST.tab)||TABS[0])[2];$("#app").innerHTML=!E.length&&!["sheet","quality"].includes(ST.tab)?'<div class="card" style="margin-top:20px">No data yet. Check the connection message above, or upload the .xlsx.</div>':f();ticker();bnav()}
const go=t=>{if(TABS.some(x=>x[0]===t)){ST.tab=t;ST.q="";render();window.scrollTo({top:0,behavior:"smooth"})}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-cp],[data-t],[data-s],[data-k],[data-dd],[data-go],[data-pre],#emb,#exp");if(!b)return;
 if(b.dataset.cp){doShare(b)}else if(b.dataset.pre){ST.pre=b.dataset.pre;render()}else if(b.dataset.t)go(b.dataset.t);else if(b.dataset.go)go(b.dataset.go);else if(b.dataset.s){const[d,i]=b.dataset.s.split("|"),c=ST.sort[d]||{i:D[d].sort,asc:false};ST.sort[d]={i:+i,asc:c.i===+i?!c.asc:false};render()}
 else if(b.dataset.k){ST.kind=b.dataset.k;render()}else if(b.dataset.dd){ST.dd=b.dataset.dd;render()}else if(b.id==="emb"){ST.embed=!ST.embed;render()}
 else if(b.id==="exp"){const rs=dr(ST.dd,E),ks=rs[0]?Object.keys(rs[0].m):[],a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv(rs.map(e=>Object.assign({date:dk(e.dt),employee:e.n},e.m)),["date","employee",...ks])],{type:"text/csv"}));a.download="adsin_"+ST.dd+".csv";a.click()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){ST.q=e.target.value;const p=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{if(e.target.id==="df"||e.target.id==="dt"){ST.pre="custom";ST.cf=$("#df").value;ST.ct=$("#dt").value;render();return}if(e.target.dataset.tg){const t=tgGet();t[e.target.dataset.tg]=+e.target.value||0;tgSet(t);render()}});
$("#ref").onclick=load;$("#prt").onclick=()=>window.print();$("#open").href=CFG.SHEET;
/* ---------- data ---------- */
const setLive=(c,t)=>{const l=$("#live");l.className="pill "+c;l.textContent=t};
function gviz(tab){return new Promise((res,rej)=>{const n="gv"+Math.random().toString(36).slice(2),s=document.createElement("script"),end=()=>{delete window[n];s.remove()},tm=setTimeout(()=>{end();rej(new Error("no response for "+tab))},15000);
 window[n]=t=>{clearTimeout(tm);end();if(!t||t.status==="error")return rej(new Error(tab));const cols=t.table.cols.map(c=>(c.label||"").trim().toUpperCase());
  res(t.table.rows.map(r=>{const o={};r.c.forEach((c,i)=>{let v=c?c.v:null;if(typeof v==="string"){const m=/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?/.exec(v);if(m)v=new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0))}if(cols[i])o[cols[i]]=v});return o}))};
 s.onerror=()=>{clearTimeout(tm);end();rej(new Error("blocked"))};s.src=`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:json;responseHandler:${n}&headers=1&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;document.head.appendChild(s)})}
async function load(){setLive("","● Loading…");const ks=Object.keys(CFG.TABS),rs=await Promise.allSettled(ks.map(k=>gviz(CFG.TABS[k]))),bad=[];
 const sig=v=>v&&v[0]?JSON.stringify(v[0]):"";
  rs.forEach((r,i)=>{if(r.status!=="fulfilled"){bad.push(CFG.TABS[ks[i]]);return}
   if(ks[i]==="off"&&sig(r.value)&&ks.some((k,j)=>k!=="off"&&rs[j].status==="fulfilled"&&sig(rs[j].value)===sig(r.value))){bad.push(CFG.TABS[ks[i]]+" (tab not found)");RAW.off=[]}else RAW[ks[i]]=r.value});
 if(bad.length===ks.length){setLive("err","● Live load failed");$("#upd").textContent="Share the sheet as “Anyone with the link – Viewer”, or use Upload .xlsx.";return}
 build();setLive("ok","● Live"+(bad.length?` · ${bad.length} tab(s) not read`:""));$("#upd").textContent="Updated "+new Date().toLocaleTimeString();render()}
$("#fi").onchange=async e=>{const f=e.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});RAW={};
 for(const k in CFG.TABS){const ws=wb.Sheets[CFG.TABS[k]];if(!ws)continue;RAW[k]=XLSX.utils.sheet_to_json(ws,{defval:null}).map(r=>{const o={};for(const h in r)o[h.trim().toUpperCase()]=r[h];return o})}
 build();setLive("ok","● File · "+f.name);$("#upd").textContent="Static copy — upload again after editing";render()};
render();load();setInterval(load,CFG.MIN*60000);
</script></body></html>
